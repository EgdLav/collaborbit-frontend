<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Outer orbit ring -->
  <circle cx="16" cy="16" r="13" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 2.5" opacity="0.5"/>

  <!-- Inner orbit ring (tilted) -->
  <ellipse cx="16" cy="16" rx="8" ry="4.5"
    stroke="#10b981" stroke-width="1.2" opacity="0.35"
    transform="rotate(-30 16 16)"/>

  <!-- Core node -->
  <circle cx="16" cy="16" r="4" fill="#10b981" opacity="0.15"/>
  <circle cx="16" cy="16" r="4" stroke="#10b981" stroke-width="1.5"/>

  <!-- Orbiting dot — top right -->
  <circle cx="24.5" cy="9.5" r="2" fill="#10b981"/>

  <!-- Orbiting dot — bottom left -->
  <circle cx="7.5" cy="22.5" r="1.4" fill="#10b981" opacity="0.6"/>

  <!-- Connection lines -->
  <line x1="16" y1="16" x2="24.5" y2="9.5" stroke="#10b981" stroke-width="0.8" opacity="0.3"/>
  <line x1="16" y1="16" x2="7.5" y2="22.5" stroke="#10b981" stroke-width="0.8" opacity="0.2"/>
</svg>
